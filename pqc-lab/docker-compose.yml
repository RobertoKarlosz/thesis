name: pqc-iot-lab

# ── Megosztott hálózati definíciók ────────────────────────────────────────────
networks:
  # Bróker-oldali hálózat: proxyk ↔ mosquitto ↔ prometheus
  broker-net:
    driver: bridge

  # Csomópontonkénti privát hálózatok: IoT csomópont ↔ saját proxy
  sensor-1-net:
    driver: bridge
    internal: true
  sensor-2-net:
    driver: bridge
    internal: true
  sensor-3-net:
    driver: bridge
    internal: true

  # Megfigyelési hálózat: prometheus ↔ grafana ↔ node-exporter
  observability-net:
    driver: bridge


# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── MQTT Bróker ─────────────────────────────────────────────────────────────
  mosquitto:
    build:
      context: ./mosquitto-oqs
      dockerfile: Dockerfile
    image: pqc-mosquitto:latest
    restart: unless-stopped
    networks:
      - broker-net
    ports:
      - "8883:8883"
    volumes:
      - ./certs:/certs:ro
    environment:
      PQC_ALG: ${PQC_ALG:-kyber768}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t 'health' -m ping -q 0 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  # ── PQC Proxy A ─────────────────────────────────────────────────────────────
  pqc-proxy-a:
    build:
      context: ./pqc-proxy
      dockerfile: Dockerfile
    image: pqc-proxy:latest
    restart: unless-stopped
    networks:
      - broker-net
      - sensor-1-net
    ports:
      - "9101:9101"
    volumes:
      - ./certs:/certs:ro
    environment:
      PQC_ALG: ${PQC_ALG:-kyber768}
      MOSQUITTO_HOST: mosquitto
      MOSQUITTO_PORT: "8883"
      METRICS_PORT: "9101"
      PROXY_ID: pqc-proxy-a
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPUS:-0.5}"
    depends_on:
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9101/metrics"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── PQC Proxy B ─────────────────────────────────────────────────────────────
  pqc-proxy-b:
    build:
      context: ./pqc-proxy
      dockerfile: Dockerfile
    image: pqc-proxy:latest
    restart: unless-stopped
    networks:
      - broker-net
      - sensor-2-net
    ports:
      - "9102:9101"
    volumes:
      - ./certs:/certs:ro
    environment:
      PQC_ALG: ${PQC_ALG:-kyber768}
      MOSQUITTO_HOST: mosquitto
      MOSQUITTO_PORT: "8883"
      METRICS_PORT: "9101"
      PROXY_ID: pqc-proxy-b
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPUS:-0.5}"
    depends_on:
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9101/metrics"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── PQC Proxy C ─────────────────────────────────────────────────────────────
  pqc-proxy-c:
    build:
      context: ./pqc-proxy
      dockerfile: Dockerfile
    image: pqc-proxy:latest
    restart: unless-stopped
    networks:
      - broker-net
      - sensor-3-net
    ports:
      - "9103:9101"
    volumes:
      - ./certs:/certs:ro
    environment:
      PQC_ALG: ${PQC_ALG:-kyber768}
      MOSQUITTO_HOST: mosquitto
      MOSQUITTO_PORT: "8883"
      METRICS_PORT: "9101"
      PROXY_ID: pqc-proxy-c
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPUS:-0.5}"
    depends_on:
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9101/metrics"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── Hőmérséklet-érzékelő 1 ─────────────────────────────────────────────────
  temperature-sensor-1:
    build:
      context: ./iot-node
      dockerfile: Dockerfile
    image: pqc-iot-node:latest
    restart: unless-stopped
    networks:
      - sensor-1-net
      - observability-net
    ports:
      - "9110:9100"
    environment:
      NODE_ID: temperature-sensor-1
      MQTT_BROKER: pqc-proxy-a
      MQTT_PORT: "1883"
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-5}
      METRICS_PORT: "9100"
    deploy:
      resources:
        limits:
          cpus: "${NODE_CPUS:-0.5}"
    depends_on:
      pqc-proxy-a:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ── Hőmérséklet-érzékelő 2 ─────────────────────────────────────────────────
  temperature-sensor-2:
    build:
      context: ./iot-node
      dockerfile: Dockerfile
    image: pqc-iot-node:latest
    restart: unless-stopped
    networks:
      - sensor-2-net
      - observability-net
    ports:
      - "9111:9100"
    environment:
      NODE_ID: temperature-sensor-2
      MQTT_BROKER: pqc-proxy-b
      MQTT_PORT: "1883"
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-5}
      METRICS_PORT: "9100"
    deploy:
      resources:
        limits:
          cpus: "${NODE_CPUS:-0.5}"
    depends_on:
      pqc-proxy-b:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ── Hőmérséklet-érzékelő 3 ─────────────────────────────────────────────────
  temperature-sensor-3:
    build:
      context: ./iot-node
      dockerfile: Dockerfile
    image: pqc-iot-node:latest
    restart: unless-stopped
    networks:
      - sensor-3-net
      - observability-net
    ports:
      - "9112:9100"
    environment:
      NODE_ID: temperature-sensor-3
      MQTT_BROKER: pqc-proxy-c
      MQTT_PORT: "1883"
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-5}
      METRICS_PORT: "9100"
    deploy:
      resources:
        limits:
          cpus: "${NODE_CPUS:-0.5}"
    depends_on:
      pqc-proxy-c:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    networks:
      - observability-net
      - broker-net
      - sensor-1-net
      - sensor-2-net
      - sensor-3-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-admin-api
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    networks:
      - observability-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/pqc-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── cAdvisor ────────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    networks:
      - observability-net
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Node Exporter ───────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    networks:
      - observability-net
    ports:
      - "9100:9100"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
