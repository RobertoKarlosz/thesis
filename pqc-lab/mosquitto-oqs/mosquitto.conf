pid_file /var/run/mosquitto/mosquitto.pid

persistence true
persistence_location /var/lib/mosquitto/

log_dest stdout
log_type all

# Sima listener csak a loopback interfészen – a TLS-t a stunnel zárja le a 8883-as porton
listener 1883 127.0.0.1
protocol mqtt

allow_anonymous true
max_connections -1
max_keepalive 60
